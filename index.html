<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scraper - Find Your Dream Job</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
        }

        .header {
            grid-column: 1 / -1;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            margin-bottom: 20px;
        }

        .search-container {
            display: flex;
            gap: 10px;
        }

        .search-box {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #764ba2;
        }

        .refresh-btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #764ba2;
        }

        .refresh-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .sidebar {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h2 {
            color: #667eea;
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group {
            margin-bottom: 22px;
        }

        .filter-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }

        .clear-filters {
            width: 100%;
            padding: 10px;
            background: #f5f5f5;
            color: #667eea;
            border: 1.5px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .clear-filters:hover {
            background: #667eea;
            color: white;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .results-header {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-count {
            font-size: 16px;
        }

        .jobs-grid {
            display: grid;
            gap: 15px;
        }

        .job-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border-left: 5px solid #667eea;
        }

        .job-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .job-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .job-company {
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
            margin-top: 4px;
        }

        .job-source {
            display: inline-block;
            background: #e8f4f8;
            color: #0277bd;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .job-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 14px 0;
        }

        .meta-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }

        .meta-location {
            background: #e3f2fd;
            color: #1565c0;
        }

        .meta-type {
            background: #fff3e0;
            color: #e65100;
        }

        .meta-salary {
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 600;
        }

        .meta-experience {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .job-description {
            color: #555;
            line-height: 1.6;
            margin: 14px 0;
            font-size: 14px;
        }

        .job-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-apply {
            background: #667eea;
            color: white;
            flex: 1;
        }

        .btn-apply:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-save {
            background: #f5f5f5;
            color: #333;
            flex: 0 1 auto;
        }

        .btn-save:hover {
            background: #e0e0e0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-results {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            color: #999;
        }

        .no-results h3 {
            color: #666;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                top: 0;
            }

            .job-header {
                flex-direction: column;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💼 Job Scraper</h1>
        <p>Find your dream job from multiple sources</p>
        <div class="search-container">
            <input type="text" class="search-box" id="searchInput" placeholder="Search by job title or company...">
            <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <h2>🔍 Filters</h2>

            <div class="filter-group">
                <label>📍 Location</label>
                <select id="locationFilter">
                    <option value="">All Locations</option>
                </select>
            </div>

            <div class="filter-group">
                <label>💼 Job Type</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                </select>
            </div>

            <div class="filter-group">
                <label>⭐ Experience Level</label>
                <select id="experienceFilter">
                    <option value="">All Levels</option>
                </select>
            </div>

            <div class="filter-group">
                <label>💰 Min Salary (PKR)</label>
                <input type="number" id="minSalaryFilter" placeholder="0">
            </div>

            <div class="filter-group">
                <label>💰 Max Salary (PKR)</label>
                <input type="number" id="maxSalaryFilter" placeholder="999999">
            </div>

            <button class="clear-filters" id="clearFiltersBtn">Clear All Filters</button>
        </div>

        <div class="main-content">
            <div class="results-header">
                <span class="results-count" id="resultsCount">Loading jobs...</span>
            </div>
            <div id="jobsContainer"></div>
        </div>
    </div>

    <script>
        const API_BASE = "https://job-scraper-backend-prod.onrender.com/api";
        let allJobs = [];
        let filters = {};

        async function init() {
            console.log("Initializing...");
            await loadFilters();
            await loadJobs();
        }

        async function loadFilters() {
            try {
                const response = await fetch(`${API_BASE}/filters`);
                const data = await response.json();

                const locationSelect = document.getElementById('locationFilter');
                const typeSelect = document.getElementById('typeFilter');
                const expSelect = document.getElementById('experienceFilter');

                data.locations.forEach(loc => {
                    const option = document.createElement('option');
                    option.value = loc;
                    option.textContent = loc;
                    locationSelect.appendChild(option);
                });

                data.job_types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    typeSelect.appendChild(option);
                });

                data.experiences.forEach(exp => {
                    const option = document.createElement('option');
                    option.value = exp;
                    option.textContent = exp;
                    expSelect.appendChild(option);
                });

                console.log("Filters loaded");
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }

        async function loadJobs() {
            try {
                const params = new URLSearchParams();

                if (filters.search) params.append('search', filters.search);
                if (filters.location) params.append('location', filters.location);
                if (filters.job_type) params.append('job_type', filters.job_type);
                if (filters.min_salary) params.append('min_salary', filters.min_salary);
                if (filters.max_salary) params.append('max_salary', filters.max_salary);
                if (filters.experience) params.append('experience', filters.experience);

                console.log("Fetching jobs with params:", params.toString());
                const response = await fetch(`${API_BASE}/jobs?${params}`);

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const jobs = await response.json();
                console.log("Jobs loaded:", jobs.length);

                allJobs = jobs;
                displayJobs(jobs);
            } catch (error) {
                console.error('Error loading jobs:', error);
                document.getElementById('jobsContainer').innerHTML = `
                    <div class="no-results">
                        <h3>⚠️ Cannot Connect to Backend</h3>
                        <p>Backend is loading... Please refresh in a moment.</p>
                        <p style="font-size: 12px; margin-top: 10px;">If error persists, backend may need more time to start.</p>
                    </div>
                `;
            }
        }

        function displayJobs(jobs) {
            const container = document.getElementById('jobsContainer');
            const resultsCount = document.getElementById('resultsCount');

            resultsCount.textContent = `Found ${jobs.length} jobs`;

            if (jobs.length === 0) {
                container.innerHTML = '<div class="no-results"><h3>No jobs found</h3><p>Try adjusting your filters!</p></div>';
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="job-card">
                    <div class="job-header">
                        <div style="flex: 1;">
                            <div class="job-title">${escapeHtml(job.title)}</div>
                            <div class="job-company">${escapeHtml(job.company)}</div>
                            <span class="job-source">${escapeHtml(job.source)}</span>
                        </div>
                    </div>
                    <div class="job-meta">
                        <span class="meta-item meta-location">📍 ${escapeHtml(job.location)}</span>
                        <span class="meta-item meta-type">${escapeHtml(job.job_type)}</span>
                        <span class="meta-item meta-salary">💰 ${escapeHtml(job.salary_text)}</span>
                        <span class="meta-item meta-experience">⭐ ${escapeHtml(job.experience)}</span>
                    </div>
                    <div class="job-description">${escapeHtml(job.description)}</div>
                    <div class="job-buttons">
                        <button class="btn btn-apply" onclick="window.open('${job.apply_link}', '_blank')">Apply Now →</button>
                        <button class="btn btn-save">💾 Save</button>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function updateFilters() {
            filters.search = document.getElementById('searchInput').value;
            filters.location = document.getElementById('locationFilter').value;
            filters.job_type = document.getElementById('typeFilter').value;
            filters.min_salary = document.getElementById('minSalaryFilter').value;
            filters.max_salary = document.getElementById('maxSalaryFilter').value;
            filters.experience = document.getElementById('experienceFilter').value;

            loadJobs();
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('locationFilter').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('minSalaryFilter').value = '';
            document.getElementById('maxSalaryFilter').value = '';
            document.getElementById('experienceFilter').value = '';

            filters = {};
            loadJobs();
        }

        async function refreshJobs() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Refreshing...';

            try {
                await fetch(`${API_BASE}/refresh`, { method: 'POST' });
                await loadJobs();
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Refresh';
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', updateFilters);
        document.getElementById('locationFilter').addEventListener('change', updateFilters);
        document.getElementById('typeFilter').addEventListener('change', updateFilters);
        document.getElementById('minSalaryFilter').addEventListener('input', updateFilters);
        document.getElementById('maxSalaryFilter').addEventListener('input', updateFilters);
        document.getElementById('experienceFilter').addEventListener('change', updateFilters);
        document.getElementById('refreshBtn').addEventListener('click', refreshJobs);
        document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);

        // Initialize
        init();
    </script>
</body>
</html>
